name: 仓库保活防休眠
on:
  schedule:
    # UTC时间，每45天执行一次
    - cron: '0 0 */45 * *'
  workflow_dispatch: # 支持手动点按钮立即运行

permissions:
  contents: write

jobs:
  keep-active:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
      - name: 生成空提交
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit --allow-empty -m "【保活】仓库防休眠，无代码改动 [skip ci]"
          git push
